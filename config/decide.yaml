# config/decide.yaml — all keys optional; missing file = layer fully off.
mode: "off"                   # off | shadow | enforce  (env SIGNALS_DECIDE_MODE overrides); quoted — YAML 1.1 parses bare `off` as boolean False
planner:
  model: xiaomi/mimo-v2.6-pro # OpenRouter (CONFIRMED id + price: $0.43/$0.87 per 1M in/out)
  base_url: https://openrouter.ai/api/v1
  max_plan_steps: 12
  plan_cache: true            # cache validated plan keyed on (domain, profile, snapshot hash)
implementers:
  bulk:
    model: deepseek/deepseek-v4.1-flash  # OpenRouter (CONFIRMED via models index; native API name: deepseek-flash)
    base_url: https://openrouter.ai/api/v1
  reasoning:
    model: z-ai/glm-5.3-flash   # OpenRouter (CONFIRMED)
    base_url: https://openrouter.ai/api/v1
    reasoning_effort: max       # sent as {"reasoning": {"effort": "max"}} on OpenRouter; native Z.ai param is reasoning_effort
decider:
  model: jev-1.13.0           # full version pin (jev-1.13 alone is NOT a confirmed request id)
  base_url: https://api.typesafe.ai/v1/systemone
  timeout_s: 5.0              # BASE per-request timeout; effective = timeout_s + per_question_s x max(0, n_questions - 3)
  per_question_s: 0.5         # seconds added per question beyond the first 3 (G4 batches ~3-10 claims per document)
  max_retries: 1              # one jittered retry on 5xx/timeout, then gate on_error applies
  error_rate_breaker: 0.20    # legacy flat key, honored only when the breaker: block is absent
  breaker:                    # structured breaker knobs (win over error_rate_breaker when present)
    min_calls: 5              # the error rate is only evaluated after this many counted calls
    threshold: 0.20           # >20% errors among counted calls -> stop calling Jev, mark run degraded
    exclude_gates: [routing, posture_audit]   # chronic minor-gate failures never trip the breaker (excluded from numerator AND denominator — A/B ledger replay: ~4 fast 4xx in these gates fail-closed 105 G4 claim rows). While open, ALL gates fast-fail.
  max_decide_tokens_per_run: 400000   # pre-flight checked BEFORE the first call (see invariants)
  gates:
    plan_qualification: {enabled: true, floor: 0.70, on_error: drop_llm}          # unchanged (hard floor; plan steps have no review semantics)
    posture_audit:      {enabled: true, shadow_only: true}                        # unchanged
    routing:            {enabled: true, route_threshold: 2000, on_error: use_deterministic}   # route_threshold = token count above which deep-context extraction is used; within ±20% is a tie (Jev breaks it)
    citation_soundness: {enabled: true, floor: 0.70, band_low: 0.30, on_error: drop_llm}      # Choice rule = top-prob-or-abstain: prob < floor => review; band_low here is informational (the band applies to the NOUL gate, need_promotion)
    need_promotion:     {enabled: true, floor: 0.70, band_low: 0.30, on_error: drop_llm}      # band_low NEW
    document_gate:      {enabled: true, relevant_min: 0.45, evidence_min: 0.55, injection_max: 0.70, on_error: use_deterministic}   # NEW
    output_screen:      {enabled: true, review_threshold: 0.35, action_threshold: 0.70, on_error: use_deterministic}                # NEW (rider)
    completeness_verify: {enabled: true, fire_threshold: 0.70, max_escalations: 20, on_error: skip}
    taxonomy_typing:     {enabled: true, confident: 0.90, ambiguous: 0.60, on_error: skip}
    event_dates:         {enabled: true, review_below: 0.60, on_error: skip}
    value_extraction:    {enabled: true, on_error: skip}
    evidence_rerank:     {enabled: true, keep_n: 0, on_error: keep_order}   # keep_n 0 = no cap; rides the document-gate request
    entity_alignment:    {enabled: true, max_pairs: 10, on_error: skip}   # NEW: discover-candidate annotation; enforce-only (shadow = rows only)
# Lab switches: opt-in diagnostics, off in the shipped posture. With persist_claims ON, every
# citation_soundness ledger row carries the judged batch's claim payloads
# ({"text","quote_span","doc_id"}) for offline diagnosis / the decide-lab — the row's
# state_hash alone is not reversible. OFF (or the block absent) keeps every ledger row
# byte-identical to the no-lab flow.
lab:
  persist_claims: false
