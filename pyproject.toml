[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signals"
version = "0.2.0"
description = "Sales signal enrichment engine (zero-cost sources)"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.27.2",
    "lxml==5.3.0",
    "beautifulsoup4>=4.12",
    "feedparser==6.0.11",
    "dnspython==2.7.0",
    "openpyxl==3.1.5",
    "playwright==1.48.0",
    "patchright>=1.49",
    "click==8.1.7",
    "loguru==0.7.2",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "pytest==8.3.4",
    "respx==0.21.1",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
# numpy is explicit here (not just an onnxruntime transitive): the retrieval
# vector leg (search.vector_search, fusion.mmr_select) imports it directly.
rerank = [
    "numpy>=1.26",
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "huggingface_hub>=0.24",
]
# Google Knowledge Graph identity discovery (gkg_ids): EKG service-account
# auth; deferred import keeps the offline lane green without it.
gkg = ["google-auth>=2"]
# Decide lab (dev-only autoresearch tooling): numeric feature families +
# baseline models. Heavy on purpose — never a core dependency, and src/lab
# is never imported by the intel pipeline (tests/test_lab_isolation.py).
lab = ["numpy>=1.26", "scikit-learn>=1.5"]

[project.scripts]
signals = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "antibot_live: live TLS fingerprint parity against tls.peet.ws (skipped unless -m antibot_live)",
    "allow_network: test is allowed to make real network calls",
    "live_fetch: hits a real network host; requires explicit opt-in",
    "fake_net_seam: test exercises a network SEAM with fake engines; no real host contacted",
    "rerank_live: requires signals[rerank] extra + model download",
    "llm_live: live calls to real LLM endpoints (OpenRouter/TypeSafe); skipped unless -m llm_live and keys present",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
# Finish line: ratchet #2 (check_untyped_defs) is ON since 2026-11-07.
# No strict mode, no disallow-any — scraper glue (BS4 tags, JSON blobs) is
# Any-shaped on purpose. Next ratchet, if ever: per-module strictness for
# NEW modules only.
ignore_missing_imports = true
warn_unused_ignores = true
files = ["src"]
check_untyped_defs = true   # ratchet #2, flipped 2026-11-07 (82→0)

[[tool.mypy.overrides]]
# bs4 4.x partial typing: Tag.get/attr widths make Tag-glue arg-type/union-attr noise
# (27 of 29 marketplace errors). Revisit if bs4 ships stricter stubs.
module = ["src.sources.marketplace.*"]
disable_error_code = ["arg-type", "union-attr"]

[[tool.mypy.overrides]]
# Strict set: modules born (or already) fully annotated stay that way.
# Convention: new src/ modules join this set by default; exemptions carry
# a reason comment. Graduations: src.core.* 2026-11-07 (42+1 completions);
# src.decide.* + src.lab.* 2026-11-07 (76+10 completions, incl. promo_ab
# precondition fixes — see docs/todo strict-set records). decide+lab were
# pinned BEFORE the calibration layer completed, so its code lives under
# the strict flags.
module = ["src.core.*", "src.decide.*", "src.lab.*"]
disallow_untyped_defs = true
warn_return_any = true
disallow_untyped_calls = true

