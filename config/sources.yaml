defaults:
  enabled: true
  cadence_hours: 24
  rate_per_host: 1.0
  max_docs_per_account: 50

sources:
  sec_edgar:
    enabled: true
    cadence_hours: 24
    rate_per_host: 8.0            # SEC allows 10 req/s; stay under
    host: "data.sec.gov"
    requires: ["cik"]
  sec_formd:
    enabled: true
    cadence_hours: 24
    rate_per_host: 8.0
    recent_days: 30
    exclude_pooled_funds: true
    include_amendments: false
  ats_greenhouse: { enabled: true, cadence_hours: 12, rate_per_host: 2.0, requires: ["ats_token"] }
  ats_lever:      { enabled: true, cadence_hours: 12, rate_per_host: 2.0, requires: ["ats_token"] }
  ats_ashby:      { enabled: true, cadence_hours: 12, rate_per_host: 2.0, requires: ["ats_token"] }
  ats_smartrecruiters: { enabled: true, cadence_hours: 24, rate_per_host: 1.0, requires: ["ats_token"] }
  ats_workable:   { enabled: true, cadence_hours: 24, rate_per_host: 1.0, requires: ["ats_token"] }
  ats_recruitee:  { enabled: true, cadence_hours: 24, rate_per_host: 1.0, requires: ["ats_token"] }
  ats_workday:    { enabled: true, cadence_hours: 24, rate_per_host: 0.5, requires: ["ats_token"] }
  news_rss:       { enabled: true, cadence_hours: 12, rate_per_host: 0.5 }
  google_news:
    enabled: true
    cadence_hours: 12
    rate_per_host: 0.5
    serp_keywords: [fundraising, series, new leadership, CEO, product launch, launches, GTM, acquisition, acquires, data breach]
  company_feed:   { enabled: true, cadence_hours: 24, rate_per_host: 1.0, requires: ["blog_feed_url"] }
  federal_register: { enabled: true, cadence_hours: 24, rate_per_host: 2.0 }
  warn_notices:   { enabled: true, cadence_hours: 24, rate_per_host: 0.5 }
  techstack:      { enabled: true, cadence_hours: 168, rate_per_host: 1.0 }
  wayback:        { enabled: true, cadence_hours: 336, rate_per_host: 0.5 }  # longest cadence band (P3 Task 5)
  crtsh:          { enabled: true, cadence_hours: 336, rate_per_host: 0.2 }
  community_hn:   { enabled: true, cadence_hours: 24, rate_per_host: 1.0 }
  community_github: { enabled: true, cadence_hours: 48, rate_per_host: 1.0 }
  community_reddit: { enabled: false, cadence_hours: 24, rate_per_host: 0.2 }   # aggressive limits; live blocked per P2 spike
  yc_batch:        { enabled: false, cadence_hours: 720, rate_per_host: 0.2 }   # stub — browser-tier upgrade required per P2 spike
  content_producthunt: { enabled: false, cadence_hours: 168, rate_per_host: 0.2 } # stub — CF-blocked per P2 spike
  appstore_reviews: { enabled: true, cadence_hours: 168, rate_per_host: 1.0 }    # live iTunes RSS (GO per P2 spike)
  bbb_profile:     { enabled: true, cadence_hours: 720, rate_per_host: 0.2 }     # live SSR (GO per P2 spike); needs extra_data.bbb_url
  ats_rippling:    { enabled: true, cadence_hours: 12, rate_per_host: 1.0 }   # P2 Task 13; requires ats_vendor=rippling + ats_token
  ats_jobvite:     { enabled: true, cadence_hours: 12, rate_per_host: 1.0 }   # P2 Task 13; requires ats_vendor=jobvite + ats_token
  ats_breezy:      { enabled: true, cadence_hours: 12, rate_per_host: 1.0 }   # P2 Task 13; requires ats_vendor=breezy + ats_token (live-probed shape)
  ats_teamtailor:  { enabled: true, cadence_hours: 12, rate_per_host: 1.0 }   # P2 Task 13; requires ats_vendor=teamtailor + ats_token
  ats_careers_page: { enabled: true, cadence_hours: 168, rate_per_host: 0.5 } # P2 Task 13; fires ONLY for accounts with no ats_vendor AND no ats_token
  marketplace_g2:
    enabled: false              # browser tier, opt-in. See config/marketplace.yaml for G2-specific options
    cadence_hours: 168
    rate_per_host: 0.5
  marketplace_capterra:
    enabled: false              # browser tier, opt-in. See config/marketplace.yaml for Capterra-specific options
    cadence_hours: 168
    rate_per_host: 0.5
  marketplace_trustradius:
    enabled: false              # browser tier, opt-in. See config/marketplace.yaml for TrustRadius-specific options
    cadence_hours: 168
    rate_per_host: 0.5
  marketplace_softwareadvice:
    enabled: false              # http tier (curl_cffi), opt-in via extra_data.sa_url; fixture-built per P3 spike
    cadence_hours: 168
    rate_per_host: 0.2
  marketplace_getapp:
    enabled: false              # http tier (curl_cffi), opt-in via extra_data.getapp_url; fixture-built per P3 spike
    cadence_hours: 168
    rate_per_host: 0.2
  content_itunes: { enabled: true, cadence_hours: 168, rate_per_host: 1.0 }
  owned_intent:   { enabled: true, cadence_hours: 1 }      # local file drop
  linkedin_db:    { enabled: true, cadence_hours: 6 }
  repvue_db:      { enabled: true, cadence_hours: 168 }
  federal_contracts: { enabled: true, cadence_hours: 168, rate_per_host: 0.5 }  # live usaspending.gov award search (GO per P3 spike)
  # gkg_ids identity-discovery task (plan T3b; not a cadence adapter —
  # resolve-time only, hence enabled: false). EKG quota is 60 rpm = exactly
  # 1 req/s with zero headroom, so pace at 0.5 req/s.
  gkg_ids:         { enabled: false, rate_per_host: 0.5 }
  jobsignals:
    enabled: true
    cadence_hours: 12
    surge_min_roles: 5
    surge_window_days: 60
  needs:
    enabled: true
    cadence_hours: 24

