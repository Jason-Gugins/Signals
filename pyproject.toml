[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "signals"
version = "0.2.0"
description = "Sales signal enrichment engine (zero-cost sources)"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.27.2",
    "lxml==5.3.0",
    "beautifulsoup4>=4.12",
    "feedparser==6.0.11",
    "googlenewsdecoder>=0.1.7",
    "dnspython==2.7.0",
    "openpyxl==3.1.5",
    "playwright==1.48.0",
    "patchright>=1.49",
    "click==8.1.7",
    "loguru==0.7.2",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "pytest==8.3.4",
    "respx==0.21.1",
    "curl_cffi>=0.7",
]

[project.optional-dependencies]
rerank = [
    "onnxruntime>=1.19",
    "tokenizers>=0.20",
    "huggingface_hub>=0.24",
]

[project.scripts]
signals = "src.cli:main"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
markers = [
    "antibot_live: live TLS fingerprint parity against tls.peet.ws (skipped unless -m antibot_live)",
    "allow_network: test is allowed to make real network calls",
    "live_fetch: hits a real network host; requires explicit opt-in",
    "fake_net_seam: test exercises a network SEAM with fake engines; no real host contacted",
    "rerank_live: requires signals[rerank] extra + model download",
]

[tool.ruff]
line-length = 100
target-version = "py312"
