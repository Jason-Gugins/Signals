<script type="application/ld+json">{"@context":"https://schema.org","@type":"FAQPage","mainEntity":[{"@type":"Question","name":"What does Parallel do?","acceptedAnswer":{"@type":"Answer","text":"Parallel builds web search and research APIs purpose-built for AI agents and agentic workflows. We run our own web-scale index with billions of pages and millions more added and updated daily. Our product suite spans the full range of knowledge work agents are helping automate for businesses: Search and Extract for real-time retrieval, Task and FindAll for deep research and entity discovery, and Monitor for continuous tracking. If your agent needs to read, research, or watch the web, Parallel is the unified platform that makes it as easy as an API call."}},{"@type":"Question","name":"How is Parallel different from other web search APIs (like Exa, Tavily, or Perplexity)?","acceptedAnswer":{"@type":"Answer","text":"Most search APIs retro-fit traditional search engines for AI, but Parallel’s Index was designed for LLMs and programmatic use from the start. Our products are powered by innovations in crawling, indexing, and retrieval applied for efficient use of LLM context windows and software pipelines. By rebuilding the stack for the agentic software market, Parallel makes AI viable for high-stakes sectors like law, finance, and healthcare where accuracy is paramount."}},{"@type":"Question","name":"Why does AI need the web?","acceptedAnswer":{"@type":"Answer","text":"Large language models are trained on past information, which means their knowledge of the present is out of date as soon as a training run begins. LLM knowledge cutoffs are often many months or even years behind present day facts. Web search APIs ground LLMs in real-world news published across the open (and in some cases, closed) web to ensure that AI always has the most up-to-date information needed to answer a query or task."}},{"@type":"Question","name":"Which Parallel API should I use?","acceptedAnswer":{"@type":"Answer","text":"Start with the job you need done: Search API returns ranked URLs and dense excerpts in real time. Use it to ground an agent or assistant in fresh, cited web context or to find the most relevant pages (URLs). Extract API turns any public URL, including hosted PDFs and JavaScript-heavy pages, into clean markdown context. Use it to pull content from public URLs you already have or recently surfaced with a web search. Responses API returns synthesized, cited answers from the live web in seconds. Use it for latency-sensitive research in products or as a web research subagent — same quality as Task, purpose-built for conversational speed. Task API runs structured deep research and data enrichment with citations and confidence scoring. Use it for reports, account briefs, due diligence, or enriching records at scale — best cost-to-quality for async or background work. FindAll API discovers and structures entity datasets from a natural language query. Use it to build a live list of anything, including but not limited to events, people, and companies. Monitor API tracks the web continuously and sends webhook alerts when something appears or changes. Use it to watch prices, news, competitors, or regulations. The general rule: Search and Extract when latency matters and you need raw context, Responses when you need synthesized answers at conversational latency, Task and FindAll when you need deeper synthesis and structure (best cost-to-quality for async or background work), Monitor when the work never stops (ambient agents that proactively do work when triggered by new information)."}},{"@type":"Question","name":"How much does Parallel cost? Is there a free plan?","acceptedAnswer":{"@type":"Answer","text":"Parallel is pay-as-you-go, priced per request rather than per token, so you know what a call costs before it runs. Web search starts as low as $1 per 1,000 requests. New accounts get a signup credit, and every account gets a recurring free monthly allowance of $5. Free credit is always spent before any paid balance, so you only pay once you’ve used it up. Parallel Search is also available via a free hosted MCP server, which is suitable for personal/hobbyist use. See parallel.ai/pricing for the full breakdown. For higher rate limits and bespoke agreements, speak with our sales team."}},{"@type":"Question","name":"What is the Parallel Web Index?","acceptedAnswer":{"@type":"Answer","text":"The Parallel Web Index is our proprietary, web-scale index of the open web, designed from the ground up to power the scale that AI web search demands. Our index contains billions of pages, and millions are added or updated daily, keeping it fresh and far-reaching."}},{"@type":"Question","name":"What is Index by Parallel?","acceptedAnswer":{"@type":"Answer","text":"Index by Parallel is a platform that helps content owners understand how AI agents use their work and earn compensation tied to the value they contribute. Compensation is calculated by estimating each source’s Shapley value, its marginal contribution to the work an agent performs at the moment of inference. Content that’s uniquely valuable, hard to replace, or used in high-value agent work earns more."}},{"@type":"Question","name":"How fresh is Parallel's data?","acceptedAnswer":{"@type":"Answer","text":"Parallel adds millions of pages to the Parallel Web Index daily, and you can force a live crawl for time-sensitive queries. Set freshness controls to require recent pages or trigger a fresh fetch, so your agent always reads what’s true today."}},{"@type":"Question","name":"How does Parallel cite its sources?","acceptedAnswer":{"@type":"Answer","text":"Search and Extract APIs include source URLs. On Parallel’s agentic APIs (Web Agents), every output supports Basis, our verifiability framework, which attaches citations, the reasoning behind a result, and a calibrated confidence score to each fact. You can trust an answer in production and audit it afterward, tracing any claim back to the page it came from. Those confidence scores also feed back into retrieval, so results improve over time."}},{"@type":"Question","name":"Is Parallel secure and compliant?","acceptedAnswer":{"@type":"Answer","text":"Yes. Parallel is SOC 2 Type II certified, HIPAA compliant, and offers zero data retention. For teams with stricter requirements, enterprise controls are available. See our terms of service for more information."}},{"@type":"Question","name":"How do I connect Parallel to my agent or existing stack?","acceptedAnswer":{"@type":"Answer","text":"You have a few options. Call the REST API directly, or use the Python (parallel-web) or TypeScript SDK. For agent frameworks, the Parallel Search MCP server drops in through Cursor, Claude Code, and other MCP-compatible tools. If you already use the OpenAI SDK, point your base URL at the Chat API and swap your key; everything else works the same. Parallel also integrates with LangChain, the Vercel AI SDK, and Google Vertex AI, and delivers async results over webhooks. Start at docs.parallel.ai."}}]}</script>
