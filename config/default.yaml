http:
  user_agent: "SignalsResearchBot/0.1 (+contact: REPLACE_ME@example.com)"
  timeout_seconds: 30
  max_retries: 3
  backoff_base: 1.5          # seconds; delay = backoff_base ** attempt + jitter
  respect_robots: true
  # Scoped robots exceptions. news.google.com disallows / but RSS is the public feed.
  robots_allow:
    - { host: news.google.com, path_prefix: /rss/ }
    # T1 probe (data/probe/KEYLESS_IDENTITY_2026_09.md): both Wikimedia hosts
    # set `Disallow: /w/` for the `*` group, but /w/api.php is the public
    # keyless JSON API the T3a identity resolvers fetch.
    - { host: www.wikidata.org, path_prefix: /w/api.php }
    - { host: en.wikipedia.org, path_prefix: /w/api.php }
  max_workers: 6             # global thread pool for HTTP fan-out
  default_rate_per_host: 1.0 # requests/sec
  verify_tls: true

browser:
  enabled: false
  headless: true
  viewport: { width: 1920, height: 1080 }
  locale: en-US
  timezone: America/Toronto
  user_agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/147.0.0.0 Safari/537.36"
  proxy_server: null         # e.g. "http://127.0.0.1:8443" to reuse ../Linkedin egress proxy
  min_delay: 5.0
  max_delay: 15.0
  session_dir: "data/state"

cloudflare:
  enabled: true
  bypass_strategy: browser_first   # browser_first | solver_first | browser_only | disabled
  solve_timeout_ms: 20000
  cookie_ttl_hours: 24              # ceiling only; real cookie expires is authoritative
  headed_fallback: false
  headed_solve_timeout_ms: 120000
  solver_provider: null            # 2captcha | anticaptcha | null
  solver_api_key: null
  max_solves_per_domain_per_24h: 1  # anti-escalation cap

datadome:
  enabled: true                 # bypass layers for marketplace_g2; live DataDome targets still need solver env vars (see .env.example)
  bypass_strategy: solver       # solver | curl_cffi_first | disabled
  solver_provider: null         # 2captcha | capsolver | null
  solver_api_key: null          # set via DATADOME_SOLVER_API_KEY env var
  headed_fallback: false        # launch visible browser on hard challenges
  cookie_ttl_hours: 24          # datadome cookies are short-lived
  residential_proxy: null       # required for solver — set via DATADOME_RESIDENTIAL_PROXY env var

antibot:
  enabled: true                 # opt-in — SignalsShadow tier-1 (real Chrome TLS) in bypass waterfalls
  fallback: curl_cffi           # tier used when the shadow tier can't clear (curl_cffi | browser)
  recheck_after_hours: 24       # periodic cold recheck window for warm domains

storage:
  db_path: "data/signals.db"
  raw_dir: "data/raw"
  export_dir: "data/exports"
  briefs_dir: "data/briefs"
  alerts_dir: "data/alerts"
  digests_dir: "data/digests"
  recon_dir: "data/recon"
  dossiers_dir: "data/dossiers"
  keep_raw_days: 400
  raw_quota_mb: null          # data/raw byte_size quota in MB; null = disabled

external_dbs:
  linkedin_db: "../Linkedin/data/linkedin.db"
  repvue_db: "../repvue-scraper/data/repvue.db"
  linkedin_cli_cwd: "../Linkedin"      # used by `signals deepen` to shell out

logging:
  level: INFO
  file: "data/logs/signals.log"
  logs_dir: "data/logs"
  rotation: "10 MB"

pipeline:
  default_lookback_days: 365
  score_on_collect: true
  alert_on_new_primary: true

exports:
  destinations:
    - { type: file }   # add - { type: webhook } to also fan out via alert_webhooks

rerank:
  enabled: true                # optional cross-encoder rerank (ms-marco-MiniLM); requires signals[rerank] extra
  floor: 0.35                  # drop news items scoring below this relevance (0..1)

# Google Knowledge Graph backend for the gkg_ids identity-discovery stage
# (waterfall stage 3). "ekg" = Enterprise Knowledge Graph (default; needs
# GOOGLE_APPLICATION_CREDENTIALS + GKG_PROJECT_ID — OAuth2 service account,
# bare API keys do not work); "kgsearch" = legacy key API (needs
# GOOGLE_KGSEARCH_KEY), off by default. Both credentials absent = the stage
# no-ops (status: unconfigured).
gkg_backend: ekg
