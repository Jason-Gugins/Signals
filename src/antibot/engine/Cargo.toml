[package]
name = "signals_antibot"
version = "0.1.0"
edition = "2021"

[lib]
name = "signals_antibot"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module"] }
boring = "4"
boring-sys = "4"
brotli = "7"
serde_json = "1"
foreign-types = "0.5"
flate2 = "1"

[profile.release]
lto = true
