version: 1
# Vendor keys (must match a `vendors:` key) that are the account's named
# competitors: a fingerprint match on one emits `competitor_detected`.
# e.g. competitors: ["Acme CRM"]
competitors: []
vendors:
  hubspot:
    display: "HubSpot"
    category: [crm, marketing_automation]
    tier: mid
    match:
      script_src: ["js.hs-scripts.com", "js.hsforms.net", "hs-analytics.net"]
      network_host: ["js.hsforms.net", "hubspotonwebflow.com", "forms-na2.hsforms.com"]
      dns_cname: ["hubspotusercontent", "hs-sites.com"]
      spf_include: ["hubspotemail.net"]
  salesforce:
    display: "Salesforce"
    category: [crm]
    tier: enterprise
    match:
      script_src: ["force.com", "salesforceliveagent.com", "pardot.com"]
      spf_include: ["salesforce.com", "pardot.com", "exacttarget.com"]
      dns_cname: ["salesforce.com"]
  marketo: { display: "Marketo", category: [marketing_automation], tier: enterprise,
             match: { script_src: ["munchkin.marketo.net"], dns_cname: ["mktoweb.com"], spf_include: ["mktomail.com"] } }
  google_workspace: { display: "Google Workspace", category: [email], tier: mid,
             match: { mx: ["google.com", "googlemail.com"] } }
  microsoft365: { display: "Microsoft 365", category: [email], tier: mid,
             match: { mx: ["outlook.com", "protection.outlook.com"] } }
  zendesk: { display: "Zendesk", category: [support], tier: mid,
             match: { script_src: ["zdassets.com"], dns_cname: ["zendesk.com"], spf_include: ["zendesk.com"] } }
  intercom: { display: "Intercom", category: [support, chat], tier: mid,
             match: { script_src: ["widget.intercom.io", "js.intercomcdn.com"] } }
  segment: { display: "Segment", category: [cdp], tier: mid,
             match: { script_src: ["cdn.segment.com"] } }
  snowflake: { display: "Snowflake", category: [data_warehouse], tier: enterprise,
             match: { job_text: ["snowflake"] } }
  # Workday HCM deals typically run on multi-year contracts, so its renewal
  # window is estimated from first_seen + 3 years (renewal_window wiring).
  workday: { display: "Workday", category: [hris], tier: enterprise, contract_years: 3,
             match: { dns_cname: ["myworkdayjobs.com"], script_src: ["myworkday.com"] } }
  statuspage: { display: "Atlassian Statuspage", category: [status], tier: mid,
             match: { dns_cname: ["statuspage.io"] } }
  webflow:
    display: Webflow
    category: [cms]
    tier: mid
    match:
      network_host: ["website-files.com"]
      script_src: ["website-files.com"]
  gtm:
    display: Google Tag Manager
    category: [tag_manager]
    tier: mid
    match:
      network_host: ["googletagmanager.com"]
      script_src: ["googletagmanager.com"]
  google_analytics:
    display: Google Analytics
    category: [analytics]
    tier: mid
    match:
      network_host: ["google-analytics.com"]
      script_src: ["google-analytics.com"]
  meta_pixel:
    display: Meta Pixel
    category: [ads]
    tier: mid
    match:
      network_host: ["connect.facebook.net"]
      script_src: ["connect.facebook.net"]
  cookieyes:
    display: CookieYes
    category: [consent]
    tier: mid
    match:
      network_host: ["cdn-cookieyes.com", "cookieyes.com"]
      script_src: ["cdn-cookieyes.com", "cookieyes.com"]
  vector:
    display: Vector
    category: [intent]
    tier: mid
    match:
      network_host: ["cdn.vector.co", "vector.co"]
      script_src: ["cdn.vector.co", "vector.co"]
  onetrust:
    display: OneTrust
    category: [consent]
    tier: mid
    match:
      network_host: ["cdn.cookielaw.org", "onetrust.com"]
      script_src: ["cdn.cookielaw.org", "onetrust.com"]
  bing_uet:
    display: Bing UET
    category: [ads]
    tier: mid
    match:
      network_host: ["bat.bing.com"]
      script_src: ["bat.bing.com"]
  vimeo:
    display: Vimeo
    category: [media]
    tier: mid
    match:
      network_host: ["player.vimeo.com", "vimeo.com"]
      script_src: ["player.vimeo.com"]
  cloudflare:
    display: Cloudflare
    category: [cdn]
    tier: mid
    match:
      network_host: ["challenges.cloudflare.com", "cloudflare.com"]
      script_src: ["challenges.cloudflare.com"]
      # Task 14 live header needle: Cloudflare's edge emits `server: cloudflare`
      # on every proxied response (substring, casefolded — also hits
      # "cloudflare-nginx" style values). Header match shape, for reference:
      # header: {x-powered-by: "next.js"}
      header: {server: "cloudflare"}
