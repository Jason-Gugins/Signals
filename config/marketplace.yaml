own_product: acme
competitors: [competitorx]
# Review-velocity trend signal thresholds: emit marketplace_review_trend
# when |count delta| or |avg rating delta| crosses these per cycle.
review_trend:
  min_count_delta: 5
  min_rating_delta: 0.5
sites:
  trustradius:
    enabled: false
    max_review_pages: 2
    review_lookback_days: 90
    session_cookie_file: null
  g2:
    enabled: false
    deep_reviews: false
    # Deep-review ("Show More") expansion bounding — the default is 'extreme':
    # expand only for reviews rated >= 4.0 or <= 2.0 (unknown ratings expand).
    # Set to null for the old bound-free behavior. Invalid values -> 'extreme'.
    deep_reviews_bound: extreme
    sign_in_required: false
    max_review_pages: 5
    review_lookback_days: 90
    session_cookie_file: data/g2_cookies.json
  capterra:
    enabled: false
    max_review_pages: 3
    review_lookback_days: 90
    session_cookie_file: null
