# Seller-market relevance profiles for `signals intel`.
#
# A profile describes what the SELLER offers, so the intel flow can separate
# "interesting public evidence" from "evidence that matters to this market".
# Fill `default` with the real offering before trusting production output:
# an empty vocabulary matches nothing on purpose and intel reports it as a gap.
#
# Full offering schema is exercised in tests/test_market_profile.py.
# NOTE: this is NOT config/marketplace.yaml (anti-bot marketplace settings).

profiles:
  default:
    seller: ""
    offerings: []

  # ===========================================================================
  # MOCK profile - DEMO/EXPERIMENT ONLY. "Northwind Security Analytics" is a
  # FICTIONAL seller invented to exercise the flow; it is NOT a real offering
  # and nothing else in the repo depends on it.
  #
  # Use it with:
  #   ./.venv/Scripts/python.exe -m src.cli intel <domain> --name "<Name>" \
  #       --market-profile sample_soc_platform
  #
  # It is deliberately modelled on vocabulary that ALREADY EXISTS in the store
  # for darktrace.com, so the demo fires on real evidence rather than on
  # invented matches. Matching notes (src/intel/market.py):
  #   * served_problem_phrases are plain substring tests on the casefolded text,
  #     so keep them lower-case and prefer stems ("integrat", not "integrating").
  #   * relevant_signal_types must contain the incoming type or the offering is
  #     skipped. `needs` only ever sends need_statement and required_stack_demand.
  #   * required_vendors is only consulted on the required_stack_demand path, and
  #     only for vendors the 46-name _vendor_vocab() already extracted.
  # ===========================================================================
  sample_soc_platform:
    seller: "Northwind Security Analytics (FICTIONAL - demo only)"
    offerings:
      # Fires on need_statement. Verified present in the first-party quotes
      # already stored for darktrace.com: "...supporting security investigation
      # and response, and helping defenders identify risky behavior across
      # enterprise AI systems and agents."
      - id: ai-agent-observability
        served_problem_phrases:
          - security investigation
          - risky behavior
          - enterprise ai systems
        relevant_signal_types: [need_statement]
        buyer_departments: [security, engineering]
        # Carried on the Offering but NOT consulted by match_relevance today;
        # listed so the schema shape is visible.
        competitor_vendors: [splunk, crowdstrike]

      # Fires on required_stack_demand. Verified in the stored job descriptions
      # (extraction yields workday x2, salesforce x1 across the 77 postings),
      # which the vendor extractor can only see because they are names in its
      # own 46-name vocabulary.
      - id: platform-integration
        required_vendors:
          - workday
          - salesforce
        relevant_signal_types: [required_stack_demand]
        buyer_departments: [it, operations]

  # ===========================================================================
  # gorgias_icp - Gorgias: ecommerce helpdesk + AI agent selling to Shopify DTC
  # brands (~$10M-$200M, 2,000-30,000+ tickets/mo). Matching notes
  # (src/intel/market.py): served_problem_phrases are lower-case substring
  # tests - prefer stems. relevant_signal_types must contain the incoming type;
  # needs only ever sends need_statement / required_stack_demand.
  # ===========================================================================
  gorgias_icp:
    seller: "Gorgias - ecommerce helpdesk and AI agent for Shopify brands"
    offerings:
      - id: ecommerce-helpdesk
        served_problem_phrases:
          - customer support
          - customer experience
          - customer service
          - helpdesk
          - ticket volume
          - support team
          - support agent
          - first response
          - response time
          - csat
          - cx team
          - seasonal support
          - support inbox
        relevant_signal_types: [need_statement]
        buyer_departments: [customer experience, support, ecommerce, operations]

      - id: ai-support-automation
        served_problem_phrases:
          - ai agent
          - automate
          - automation
          - deflect
          - self-service
          - chatbot
        relevant_signal_types: [need_statement]
        buyer_departments: [customer experience, support, ecommerce]

      - id: commerce-stack-fit
        required_vendors:
          - shopify
          - klaviyo
          - recharge
          - zendesk
          - kustomer
          - freshdesk
          - salesforce
          - hubspot
        relevant_signal_types: [required_stack_demand]
        buyer_departments: [customer experience, support, ecommerce, operations]
        competitor_vendors: [zendesk, kustomer, freshdesk, gladly, intercom]

  # ===========================================================================
  # darktrace_sec - USER-APPROVED ICP (2026-10-30): Darktrace confirmed as
  # the test seller; the 30-company evaluation cohort is size-filtered to
  # 51+ employees (seeded Random(42) from the RepVue Canada software file).
  # Seller: Darktrace (darktrace.com) — Self-Learning AI cybersecurity:
  # network detection & response (NDR), email security (Antigena Email),
  # cloud security, OT/IoT, autonomous response.
  #
  # Grounding (measured, not guessed):
  #  * Vocabulary validated against darktrace's own 266-doc corpus vs the
  #    negative baseline (rillet/databricks): every retained phrase
  #    separates (threat detection 29/0/0, phishing 87/0/0, ciso 51/0/0,
  #    ransomware 131/0/0, security team 40/0/0, attack surface 53/0/0).
  #    DROPPED as duds: "security alert" (0), "managed detection" (0 —
  #    Darktrace does not position as MDR).
  #  * Substring-matcher hygiene: no bare "soc" (matches "associate"),
  #    no bare "ai" (matches "said"/"maintain") — phrases are
  #    collision-checked stems.
  #  * "compliance" deliberately OMITTED: measured count in darktrace's own
  #    corpus is 5 — their positioning is threat-first, not compliance-first.
  #  * required_vendors use ONLY names in the needs vendor vocabulary
  #    (25 fingerprint vendors + supplemental): microsoft365/google_workspace
  #    are present and are Antigena Email's exact environment fit; aws/azure
  #    are NOT in the vocabulary, so the cloud offering carries none.
  #  * OT/IoT offering deliberately omitted: the test cohort (Canadian
  #    software companies) has no operational-technology footprint.
  # ===========================================================================
  darktrace_sec:
    seller: "Darktrace — Self-Learning AI cybersecurity: network detection & response, email, cloud"
    offerings:
      - id: threat-detection-response
        served_problem_phrases:
          - threat detection
          - incident respons
          - security operations
          - security team
          - soc team
          - cyber attack
          - ransomware
          - breach
          - attack surface
          - threat hunting
          - malware
          - vulnerability
          - compromise
          - security posture
          - ciso
        relevant_signal_types: [need_statement, required_stack_demand]
        buyer_departments: [security, information technology, engineering]
        required_vendors: []
        competitor_vendors: [crowdstrike, palo alto networks, sentinelone, vectra]

      - id: email-security
        served_problem_phrases:
          - email security
          - phishing
          - business email compromise
        relevant_signal_types: [need_statement, required_stack_demand]
        buyer_departments: [security, information technology]
        required_vendors: [microsoft365, google_workspace]
        competitor_vendors: [mimecast, proofpoint]

      - id: cloud-security
        served_problem_phrases:
          - cloud security
        relevant_signal_types: [need_statement, required_stack_demand]
        buyer_departments: [security, engineering, infrastructure]
        required_vendors: []
        competitor_vendors: [wiz, orca security]
