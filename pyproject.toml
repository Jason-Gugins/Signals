[project]
name = "signals"
version = "0.1.0"
description = "Sales signal enrichment engine (zero-cost sources)"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
